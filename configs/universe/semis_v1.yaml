# ARGUS semiconductor universe, v1
#
# ~100 US-listed names across the five sub-segments, 2010-present. Scope was widened from
# the original 15-ticker pilot because cross-sectional rank IC on 15 names has a per-day
# standard deviation around 0.25-0.30 -- a true IC of 0.04 is indistinguishable from zero
# at that width, which would make the Phase 1 gate unmeasurable.
#
# The CPT corpus stays at the 15 pilot tickers (marked `pilot: true`). Quant universe and
# text corpus are deliberately decoupled: price history is cheap and wide, curated text is
# expensive and narrow.

start_date: "2010-01-01"

filters:
  min_price: 5.0                    # avoid sub-$5 microstructure noise
  min_dollar_volume_60d: 10_000_000 # tradeable size for a swing book
  require_us_primary_listing: true

benchmark:
  # Equal-weight, constructed from the universe itself. NOT cap-weighted SOXX:
  # NVDA can exceed 10% of a cap-weighted semis index, so its own move would compress
  # its measured relative return. See labels.py for the leave-one-out construction.
  method: equal_weight
  reference_only: ["SOXX", "^SOX"]  # reported for context, never used for labelling

