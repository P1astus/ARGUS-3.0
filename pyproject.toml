[project]
name = "argus"
version = "0.1.0"
description = "Local AI-powered swing-trading decision-support agent for the semiconductor sector"
requires-python = ">=3.12"
dependencies = [
    # Stage 1 quant core
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17.0",
    "scipy>=1.14",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",  # lightgbm.sklearn requires it
    "yfinance>=0.2.50",
    # shared
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.optional-dependencies]
# Stage 5 engine. Kept optional so the quant core installs without MLX.
#
# mlx-embeddings drives the dense side of retrieval. Note it pulls in mlx-vlm, mlx-audio
# and opencv-python transitively (~50MB of unrelated modality support) -- none of it is
# imported by ARGUS, but it is why `uv pip install` here is heavier than it looks.
engine = ["mlx>=0.30", "mlx-lm>=0.30", "mlx-embeddings>=0.1", "huggingface-hub>=0.26"]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[project.scripts]
argus = "argus.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = false
